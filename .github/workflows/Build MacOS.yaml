name: Build MacOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install dependencies
        run: |
          brew update
          brew install sdl2 freetype ffmpeg pkg-config

      - name: Get FFmpeg flags via pkg-config
        id: ffmpeg_flags
        run: |
          echo "CFLAGS=$(pkg-config --cflags libavformat libavcodec libavutil)" >> $GITHUB_ENV
          echo "LDFLAGS=$(pkg-config --libs libavformat libavcodec libavutil)" >> $GITHUB_ENV

      - name: Clean build
        run: rm -rf build

      - name: Configure CMake
        run: |
          cmake -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_FLAGS="${{ env.CFLAGS }}" \
                -DCMAKE_EXE_LINKER_FLAGS="${{ env.LDFLAGS }}" \
                -DCMAKE_OSX_ARCHITECTURES=arm64 \
                -S .

      - name: Build
        run: cmake --build build

      - name: Find executable
        id: find_exe
        run: |
          EXE=$(find ${{ github.workspace }}/build -type f -name "sdlMS" | head -n 1)
          if [ -z "$EXE" ]; then
            echo "No executable found" >&2
            exit 1
          fi
          echo "EXE_PATH=$EXE" >> $GITHUB_ENV
          echo "Found executable at: $EXE"

      - name: Copy all dependencies recursively and fix library dependencies
        run: |
          EXE="${{ env.EXE_PATH }}"
          EXEDIR=$(dirname "$EXE")
          LIBDIR="$EXEDIR/lib"
          mkdir -p "$LIBDIR"
          echo "LIB_PATH=$LIBDIR" >> $GITHUB_ENV

          declare -A processed

          process_file() {
            local file="$1"
            local file_type="$2"
            
            local deps=$(otool -L "$file" | grep -v '^@' | grep -v '/System/' | grep -v '/usr/lib/' | awk '{print $1}' | grep -v ':$')
            
            for dep in $deps; do
              base=$(basename "$dep")
              target="$LIBDIR/$base"
              
              if [[ "$dep" == @rpath/* ]] && [ -f "$target" ]; then
                continue
              fi
              
              if [[ "$dep" == /* ]]; then
                src="$dep"
              else
                src=$(find /usr/local/lib /opt/homebrew/lib -name "$base" 2>/dev/null | head -n 1)
              fi
              
              if [ -z "$src" ] || [ ! -f "$src" ]; then
                echo "Warning: Cannot locate $dep for $file, skipping"
                continue
              fi
              
              if [ -z "${processed[$base]}" ]; then
                cp -n "$src" "$target" || true
                install_name_tool -id "@rpath/$base" "$target"
                processed[$base]=1
                process_file "$target" "lib"
              fi
              
              if [[ "$file_type" == "exe" ]] || [[ "$file_type" == "lib" ]]; then
                oldpath=$(otool -L "$file" | grep "$base" | grep -v '^@' | awk '{print $1}' | head -n 1)
                if [ -n "$oldpath" ] && [ "$oldpath" != "@rpath/$base" ]; then
                  install_name_tool -change "$oldpath" "@rpath/$base" "$file"
                fi
              fi
            done
          }

          process_file "$EXE" "exe"
          install_name_tool -add_rpath "@executable_path/lib" "$EXE" 2>/dev/null || true
          echo "All dependencies copied and library dependencies fixed."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdlMS-macos
          path: |
            ${{ env.EXE_PATH }}
            ${{ env.LIB_PATH }}/*.dylib
          if-no-files-found: error