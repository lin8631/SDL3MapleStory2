name: Build MacOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install dependencies
        run: |
          brew update
          brew install sdl2 freetype ffmpeg pkg-config

      - name: Get FFmpeg flags via pkg-config
        id: ffmpeg_flags
        run: |
          echo "CFLAGS=$(pkg-config --cflags libavformat libavcodec libavutil)" >> $GITHUB_ENV
          echo "LDFLAGS=$(pkg-config --libs libavformat libavcodec libavutil)" >> $GITHUB_ENV

      - name: Clean build
        run: rm -rf build

      - name: Configure CMake
        run: |
          cmake -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_FLAGS="${{ env.CFLAGS }}" \
                -DCMAKE_EXE_LINKER_FLAGS="${{ env.LDFLAGS }}" \
                -DCMAKE_OSX_ARCHITECTURES=arm64 \
                -S .

      - name: Build
        run: cmake --build build

      # 查找可执行文件并设置为环境变量
      - name: Find executable
        id: find_exe
        run: |
          EXE=$(find ${{ github.workspace }}/build -type f -name "sdlMS" | head -n 1)
          if [ -z "$EXE" ]; then
            echo "No executable found" >&2
            exit 1
          fi
          echo "EXE_PATH=$EXE" >> $GITHUB_ENV
          echo "Found executable at: $EXE"

      # 复制所有非系统依赖库并设置 RPATH
      - name: Copy dependencies and set RPATH
        run: |
          EXE="${{ env.EXE_PATH }}"
          EXEDIR=$(dirname "$EXE")
          LIBDIR="$EXEDIR/lib"
          mkdir -p "$LIBDIR"
          echo "LIB_PATH=$LIBDIR" >> $GITHUB_ENV

          # 获取所有非系统、非框架的依赖库路径
          deps=$(otool -L "$EXE" | grep -v '^@' | grep -v '/System/' | grep -v '/usr/lib/' | awk '{print $1}' | grep -v ':$')
          for dep in $deps; do
            if [[ "$dep" != /* ]]; then
              # 如果是相对路径，尝试在 Homebrew 路径查找
              base=$(basename "$dep")
              found=$(find /usr/local/lib /opt/homebrew/lib -name "$base" 2>/dev/null | head -n 1)
              if [ -n "$found" ]; then
                dep="$found"
              else
                echo "Warning: Cannot locate $dep, skipping"
                continue
              fi
            fi
            # 复制库文件（不覆盖已存在文件）
            cp -n "$dep" "$LIBDIR/" || true
          done

          # 修改所有复制进来的库的 ID
          for lib in "$LIBDIR"/*.dylib; do
            base=$(basename "$lib")
            install_name_tool -id "@rpath/$base" "$lib"
          done

          # 修改可执行文件对库的依赖路径
          for lib in "$LIBDIR"/*.dylib; do
            base=$(basename "$lib")
            # 查找可执行文件中引用该库的旧路径（可能包含版本号）
            oldpath=$(otool -L "$EXE" | grep "$base" | grep -v '^@' | awk '{print $1}' | head -n 1)
            if [ -n "$oldpath" ]; then
              install_name_tool -change "$oldpath" "@rpath/$base" "$EXE"
            fi
          done

          # 设置可执行文件的 rpath
          install_name_tool -add_rpath "@executable_path/lib" "$EXE"
          echo "Dependencies copied and RPATH set."

      # 上传可执行文件和所有依赖库
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdlMS-macos
          path: |
            ${{ env.EXE_PATH }}
            ${{ env.LIB_PATH }}/*.dylib
          if-no-files-found: error