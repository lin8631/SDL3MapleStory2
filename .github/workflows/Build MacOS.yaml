name: Build macOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install dependencies
        run: |
          brew update
          brew install sdl2 freetype ffmpeg pkg-config

      - name: Get FFmpeg flags via pkg-config
        id: ffmpeg_flags
        run: |
          echo "CFLAGS=$(pkg-config --cflags libavformat libavcodec libavutil)" >> $GITHUB_ENV
          echo "LDFLAGS=$(pkg-config --libs libavformat libavcodec libavutil)" >> $GITHUB_ENV

      - name: Clean build
        run: rm -rf build

      - name: Configure CMake
        run: |
          cmake -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_FLAGS="${{ env.CFLAGS }}" \
                -DCMAKE_EXE_LINKER_FLAGS="${{ env.LDFLAGS }}" \
                -S .

      - name: Build
        run: cmake --build build

      # 递归查找可执行文件
      - name: Find executable
        id: find_exe
        run: |
          EXE=$(find ${{ github.workspace }} -type f -name "sdlMS" -o -name "sdlMS.exe" | head -n 1)
          if [ -z "$EXE" ]; then
            echo "No executable found" >&2
            exit 1
          fi
          echo "EXE_PATH=$EXE" >> $GITHUB_ENV
          echo "Found executable at: $EXE"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: sdlMS-macos
          path: ${{ env.EXE_PATH }}
          if-no-files-found: error
