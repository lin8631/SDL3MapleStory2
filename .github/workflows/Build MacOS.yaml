name: Build MacOS (Static)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $GITHUB_ENV

      - name: Update vcpkg ports
        run: $VCPKG_ROOT/vcpkg update

      - name: Install static dependencies via vcpkg
        run: |
          export VCPKG_LIBRARY_LINKAGE=static
          $VCPKG_ROOT/vcpkg install freetype ffmpeg pkgconf --triplet=arm64-osx

      - name: Install pkg-config
        run: brew install pkg-config

      - name: Set PKG_CONFIG_PATH
        run: echo "PKG_CONFIG_PATH=$VCPKG_ROOT/installed/arm64-osx/lib/pkgconfig" >> $GITHUB_ENV

      - name: Clean build
        run: rm -rf build

      - name: Configure CMake
        run: |
          cmake -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake" \
                -DVCPKG_TARGET_TRIPLET=arm64-osx \
                -S .

      - name: Build
        run: cmake --build build

      - name: Find executable
        id: find_exe
        run: |
          EXE=$(find ${{ github.workspace }}/build -type f -name "sdlMS" | head -n 1)
          if [ -z "$EXE" ]; then
            echo "No executable found" >&2
            exit 1
          fi
          echo "EXE_PATH=$EXE" >> $GITHUB_ENV
          echo "Found executable at: $EXE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdlMS-macos-static
          path: ${{ env.EXE_PATH }}
          if-no-files-found: error