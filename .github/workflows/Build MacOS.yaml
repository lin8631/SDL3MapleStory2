name: Build MacOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  macos:
    runs-on: macos-14   # 使用 Apple Silicon runner，确保构建 arm64 二进制
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install dependencies
        run: |
          brew update
          brew install sdl2 freetype ffmpeg pkg-config

      - name: Get FFmpeg flags via pkg-config
        id: ffmpeg_flags
        run: |
          echo "CFLAGS=$(pkg-config --cflags libavformat libavcodec libavutil)" >> $GITHUB_ENV
          echo "LDFLAGS=$(pkg-config --libs libavformat libavcodec libavutil)" >> $GITHUB_ENV

      - name: Clean build
        run: rm -rf build

      - name: Configure CMake
        run: |
          cmake -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_FLAGS="${{ env.CFLAGS }}" \
                -DCMAKE_EXE_LINKER_FLAGS="${{ env.LDFLAGS }}" \
                -DCMAKE_OSX_ARCHITECTURES=arm64 \   # 强制生成 arm64 二进制
                -S .

      - name: Build
        run: cmake --build build

      # 查找可执行文件并设置为环境变量
      - name: Find executable
        id: find_exe
        run: |
          EXE=$(find ${{ github.workspace }}/build -type f -name "sdlMS" | head -n 1)
          if [ -z "$EXE" ]; then
            echo "No executable found" >&2
            exit 1
          fi
          echo "EXE_PATH=$EXE" >> $GITHUB_ENV
          echo "Found executable at: $EXE"

      # 复制 FFmpeg 库并修改 RPATH
      - name: Copy FFmpeg libraries and set RPATH
        run: |
          EXE="${{ env.EXE_PATH }}"
          EXEDIR=$(dirname "$EXE")
          LIBDIR="$EXEDIR/lib"
          mkdir -p "$LIBDIR"
          echo "LIB_PATH=$LIBDIR" >> $GITHUB_ENV

          # 找出依赖的 FFmpeg 库（以 libav 或 libsw 开头）
          deps=$(otool -L "$EXE" | grep -E 'libav|libsw' | awk '{print $1}')
          for dep in $deps; do
            if [[ "$dep" != /* ]]; then
              base=$(basename "$dep")
              found=$(find /usr/local/lib /opt/homebrew/lib -name "$base" 2>/dev/null | head -n 1)
              if [ -n "$found" ]; then
                dep="$found"
              else
                echo "Warning: Cannot locate $dep, skipping"
                continue
              fi
            fi
            cp "$dep" "$LIBDIR/"
            newname="@rpath/$(basename "$dep")"
            install_name_tool -id "$newname" "$LIBDIR/$(basename "$dep")"
          done

          for lib in "$LIBDIR"/*.dylib; do
            base=$(basename "$lib")
            oldpath=$(otool -L "$EXE" | grep "$base" | awk '{print $1}')
            if [ -n "$oldpath" ]; then
              install_name_tool -change "$oldpath" "@rpath/$base" "$EXE"
            fi
          done

          install_name_tool -add_rpath "@executable_path/lib" "$EXE"
          echo "FFmpeg libraries copied and RPATH set."

      # 上传可执行文件和库
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdlMS-macos
          path: |
            ${{ env.EXE_PATH }}
            ${{ env.LIB_PATH }}/*.dylib
          if-no-files-found: error