name: Build Ubuntu (Static)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  ubuntu-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Install SDL3 system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxi-dev libxcursor-dev libxfixes-dev libxrender-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libjack-jackd2-dev libsndio-dev \
            libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdrm-dev libgbm-dev \
            libusb-1.0-0-dev libunwind-dev \
            libpng-dev libbz2-dev libharfbuzz-dev \
            libfreetype-dev

      - name: Install vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $GITHUB_ENV

      - name: Install static dependencies via vcpkg
        run: |
          export VCPKG_LIBRARY_LINKAGE=static
          $VCPKG_ROOT/vcpkg install freetype ffmpeg pkgconf --triplet=x64-linux

      - name: Set PKG_CONFIG_PATH
        run: echo "PKG_CONFIG_PATH=$VCPKG_ROOT/installed/x64-linux/lib/pkgconfig" >> $GITHUB_ENV

      - name: Clean build
        run: rm -rf build

      - name: Configure CMake
        run: |
          cmake -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake" \
                -DVCPKG_TARGET_TRIPLET=x64-linux \
                -S .

      - name: Build
        run: cmake --build build

      - name: Find executable
        id: find_exe
        run: |
          EXE=$(find ${{ github.workspace }}/build -type f -name "sdlMS" | head -n 1)
          if [ -z "$EXE" ]; then
            echo "No executable found" >&2
            exit 1
          fi
          echo "EXE_PATH=$EXE" >> $GITHUB_ENV
          echo "Found executable at: $EXE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdlMS-ubuntu-static
          path: ${{ env.EXE_PATH }}
          if-no-files-found: error