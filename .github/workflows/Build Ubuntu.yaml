name: Build Ubuntu (gcc)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ubuntu-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxi-dev libxcursor-dev libxfixes-dev libxrender-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libjack-jackd2-dev libsndio-dev \
            libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdrm-dev libgbm-dev \
            libusb-1.0-0-dev libunwind-dev \
            libpng-dev libbz2-dev libharfbuzz-dev \
            libfreetype-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev

      - name: Install patchelf (for RPATH modification)
        run: sudo apt-get install -y patchelf

      - name: Clean build
        run: rm -rf build

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -S .

      - name: Build
        run: cmake --build build

      - name: Copy FFmpeg libraries and set RPATH
        run: |
          # 确定可执行文件路径
          EXE="build/sdlms/sdlMS"
          if [ ! -f "$EXE" ]; then
            echo "Executable not found"
            exit 1
          fi

          # 创建 lib 目录
          LIBDIR="build/sdlms/lib"
          mkdir -p "$LIBDIR"

          # 使用 ldd 列出所有依赖，过滤出 FFmpeg 相关库（包括 libav*, libsw*, libpostproc*, libavdevice*）
          ldd "$EXE" | awk '/=>/ {print $1, $3}' | grep -E '^(lib(av|sw|postproc|avdevice))' | while read soname path; do
            if [ -f "$path" ]; then
              # 获取实际文件路径（跟随符号链接）
              real_path=$(readlink -f "$path")
              base_name=$(basename "$real_path")
              # 复制实际文件到 lib 目录
              cp "$real_path" "$LIBDIR/$base_name"
              # 如果库名（soname）与实际文件名不同，创建符号链接
              if [ "$soname" != "$base_name" ]; then
                (cd "$LIBDIR" && ln -sf "$base_name" "$soname")
              fi
              echo "Copied $soname ($real_path)"
            else
              echo "Warning: $soname not found at $path"
            fi
          done

          # 修改 RPATH 使程序优先从 $ORIGIN/lib 查找库
          patchelf --set-rpath '$ORIGIN/lib' "$EXE"

          echo "FFmpeg libraries copied and RPATH set."

      - name: Upload artifact (executable + libraries)
        uses: actions/upload-artifact@v4
        with:
          name: sdlMS-ubuntu
          path: |
            build/sdlms/sdlMS
            build/sdlms/lib/*.so*
          if-no-files-found: error