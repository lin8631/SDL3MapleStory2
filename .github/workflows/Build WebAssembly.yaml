name: Build WebAssembly

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  emscripten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          echo "EMSDK=$PWD" >> $GITHUB_ENV
          echo "$PWD/upstream/emscripten" >> $GITHUB_PATH

      # 修补子模块中的 CMakeLists.txt，移除所有 -march 相关的行
      - name: Patch submodules to remove -march
        run: |
          find Game Engine -name "CMakeLists.txt" -exec sed -i '/-march/d' {} \;
          find Game Engine -name "*.cmake" -exec sed -i '/-march/d' {} \;

      - name: Configure CMake (Emscripten)
        run: |
          cmake -B build-web \
                -DCMAKE_TOOLCHAIN_FILE=${{ env.EMSDK }}/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_FLAGS="" \
                -DCMAKE_CXX_FLAGS="" \
                -DCMAKE_SYSTEM_PROCESSOR=wasm32 \
                -DSDL_X11=OFF -DSDL_WAYLAND=OFF \
                -S .

      # 构建前，清理 CMake 生成的 flags 文件中可能残留的 -march
      - name: Clean -march from generated flags
        run: |
          find build-web -name "flags.make" -exec sed -i '/-march/d' {} \;
          find build-web -name "*.ninja" -exec sed -i '/-march/d' {} \; 2>/dev/null || true

      - name: Build WebAssembly
        run: cmake --build build-web

      - name: Upload WebAssembly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdlMS-web
          path: |
            build-web/sdlms/sdlMS.js
            build-web/sdlms/sdlMS.wasm
            build-web/sdlms/sdlMS.data
            build-web/sdlms/sdlMS.html
          if-no-files-found: warn