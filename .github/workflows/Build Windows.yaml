name: Build Windows（Clang 19 + Ninja）

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Initialize wzlibcpp submodules
        run: |
          cd Game/wzlibcpp
          git submodule update --init --recursive

      - name: Install LLVM (latest, 19+)
        run: |
          choco install llvm
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install CMake and Ninja
        run: |
          choco install cmake --version=3.28.3
          choco install ninja

      - name: Install vcpkg and FFmpeg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg install ffmpeg:x64-windows

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_CXX_COMPILER=clang++ `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        run: ninja -C build

      # 上传构建产物
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: sdlMS-windows
          path: build/sdlMS.exe   # 根据您的 CMake 设置，可执行文件输出在 build/ 目录下
          if-no-files-found: error
