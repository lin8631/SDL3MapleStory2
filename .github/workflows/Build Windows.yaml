- name: Setup vcpkg
  run: |
    git clone https://github.com/Microsoft/vcpkg.git
    .\vcpkg\bootstrap-vcpkg.bat
    echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

- name: Install dependencies with vcpkg
  run: |
    vcpkg install ffmpeg[core,avcodec,avformat,avutil] freetype --triplet x64-windows

- name: Debug vcpkg installation
  run: |
    echo "=== Installed packages ==="
    vcpkg list
    echo "=== Searching for FFmpeg ==="
    Get-ChildItem -Path $env:VCPKG_ROOT -Recurse -Include "avformat.h", "avcodec.h", "avutil.h" -ErrorAction SilentlyContinue

- name: Locate FFmpeg paths
  id: locate_ffmpeg
  run: |
    $header = Get-ChildItem -Path $env:VCPKG_ROOT -Recurse -Filter "avformat.h" | Select-Object -First 1
    if (-not $header) {
      Write-Error "FFmpeg headers not found"
      exit 1
    }
    $includePath = $header.Directory.FullName
    $libPath = Join-Path (Split-Path $includePath -Parent) "lib"
    echo "FFMPEG_INCLUDE=$includePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    echo "FFMPEG_LIB=$libPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    echo "Found include at: $includePath"
    echo "Found lib at: $libPath"

- name: Configure CMake
  env:
    INCLUDE: ${{ env.FFMPEG_INCLUDE }};${{ env.INCLUDE }}
    LIB: ${{ env.FFMPEG_LIB }};${{ env.LIB }}
  run: |
    cmake -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -S .
