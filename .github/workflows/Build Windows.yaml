name: Build Windows（Clang 19 + Ninja）

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Initialize wzlibcpp submodules
        run: |
          cd Game/wzlibcpp
          git submodule update --init --recursive

      - name: Install LLVM (latest, 19+)
        run: |
          choco install llvm
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install CMake and Ninja
        run: |
          choco install cmake --version=3.28.3
          choco install ninja

      - name: Install vcpkg and FFmpeg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg install ffmpeg:x64-windows

      # 安装 pkg-config（Windows 使用 pkgconfiglite）
      - name: Install pkg-config
        run: choco install pkgconfiglite

      # 设置 PKG_CONFIG_PATH，使 pkg-config 能找到 vcpkg 安装的 .pc 文件
      - name: Set PKG_CONFIG_PATH
        run: echo "PKG_CONFIG_PATH=$env:VCPKG_ROOT\installed\x64-windows\lib\pkgconfig" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_CXX_COMPILER=clang++ `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        run: ninja -C build

      # 复制 FFmpeg DLL 到输出目录（Windows 为动态链接，需要复制 DLL）
      - name: Copy FFmpeg DLLs
        run: |
          $vcpkgBin = "${{ github.workspace }}\vcpkg\installed\x64-windows\bin"
          $outputDir = "${{ github.workspace }}\build"
          Copy-Item -Path "$vcpkgBin\avcodec-*.dll" -Destination $outputDir
          Copy-Item -Path "$vcpkgBin\avformat-*.dll" -Destination $outputDir
          Copy-Item -Path "$vcpkgBin\avutil-*.dll" -Destination $outputDir
          Copy-Item -Path "$vcpkgBin\swscale-*.dll" -Destination $outputDir
          Copy-Item -Path "$vcpkgBin\swresample-*.dll" -Destination $outputDir
          Write-Host "FFmpeg DLLs copied to build directory"

      # 上传 artifacts（exe 和 FFmpeg DLL）
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdlMS-windows
          path: |
            build/sdlMS.exe
            build/avcodec-*.dll
            build/avformat-*.dll
            build/avutil-*.dll
            build/swscale-*.dll
            build/swresample-*.dll
          if-no-files-found: error