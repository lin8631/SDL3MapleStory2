name: Build Windows (Clang 19 + Ninja, Static)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Initialize wzlibcpp submodules
        run: |
          cd Game/wzlibcpp
          git submodule update --init --recursive

      - name: Install LLVM (latest, 19+)
        run: |
          choco install llvm
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install CMake and Ninja
        run: |
          choco install cmake --version=3.28.3
          choco install ninja

      - name: Install vcpkg and dependencies (static)
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          # 使用静态三元组，安装所有必需依赖
          .\vcpkg\vcpkg install freetype ffmpeg pkgconf --triplet=x64-windows-static

      - name: Install pkg-config
        run: choco install pkgconfiglite

      - name: Set PKG_CONFIG_PATH
        run: echo "PKG_CONFIG_PATH=$env:VCPKG_ROOT\installed\x64-windows-static\lib\pkgconfig" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_CXX_COMPILER=clang++ `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build
        run: ninja -C build

      # 不再复制 DLL，直接上传 exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdlMS-windows-static
          path: build/sdlMS.exe
          if-no-files-found: error