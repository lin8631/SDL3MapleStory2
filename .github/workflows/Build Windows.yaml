name: Build Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies with vcpkg
        run: |
          vcpkg install ffmpeg freetype --triplet x64-windows

      - name: Find FFmpeg paths
        id: ffmpeg_paths
        run: |
          # 查找 include 目录（通常位于 installed/x64-windows/include）
          $includePath = Join-Path $env:VCPKG_ROOT "installed\x64-windows\include"
          $libPath = Join-Path $env:VCPKG_ROOT "installed\x64-windows\lib"
          if (-not (Test-Path $includePath)) {
            Write-Error "Include path not found: $includePath"
            exit 1
          }
          if (-not (Test-Path $libPath)) {
            Write-Error "Lib path not found: $libPath"
            exit 1
          }
          echo "FFMPEG_INCLUDE=$includePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "FFMPEG_LIB=$libPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "Found include: $includePath"
          echo "Found lib: $libPath"

      - name: Configure CMake
        run: |
          cmake -B build `
                -DCMAKE_BUILD_TYPE=Release `
                -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
                -DVCPKG_TARGET_TRIPLET=x64-windows `
                -S .

      - name: Build
        env:
          INCLUDE: ${{ env.FFMPEG_INCLUDE }};${{ env.INCLUDE }}
          LIB: ${{ env.FFMPEG_LIB }};${{ env.LIB }}
        run: cmake --build build --config Release

      - name: Find executable
        id: find_exe
        run: |
          $exe = Get-ChildItem -Recurse ${{ github.workspace }} -Filter "sdlMS.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No executable found"
            exit 1
          }
          echo "EXE_PATH=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "Found executable at: $($exe.FullName)"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: sdlMS-windows
          path: ${{ env.EXE_PATH }}
          if-no-files-found: error
