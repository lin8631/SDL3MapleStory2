name: Build with Clang 18 + Ninja

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: true  # 关键：拉取所有子模块
          fetch-depth: 0    # 可选，拉取完整历史，如果需要

      - name: Install LLVM 18 (allow downgrade)
        run: |
          choco install llvm --version=18.1.0 --allow-downgrade
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install CMake and Ninja
        run: |
          choco install cmake --version=3.28.3
          choco install ninja

      - name: Install vcpkg and FFmpeg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg install ffmpeg:x64-windows

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_CXX_COMPILER=clang++ `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        run: ninja -C build
