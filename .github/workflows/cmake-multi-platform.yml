name: CMake on multiple platforms (with Emscripten)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        emscripten: [false]   # 默认不启用 Emscripten
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          # 新增 Emscripten 构建（运行在 Ubuntu）
          - os: ubuntu-latest
            c_compiler: emcc
            cpp_compiler: em++
            emscripten: true
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    # 调试：列出项目文件，确保 CMakeLists.txt 存在
    - name: List source files
      run: ls -la ${{ github.workspace }}

    # 安装 Emscripten（仅当 emscripten 为 true 时）
    - name: Install Emscripten
      if: ${{ matrix.emscripten }}
      shell: bash
      run: |
        git clone https://github.com/emscripten-core/emsdk.git
        cd emsdk
        ./emsdk install latest
        ./emsdk activate latest
        echo "EMSDK=$PWD" >> $GITHUB_ENV
        echo "$PWD/upstream/emscripten" >> $GITHUB_PATH

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    # 原生构建配置
    - name: Configure CMake (Native)
      if: ${{ !matrix.emscripten }}
      run: |
        cmake -B ${{ steps.strings.outputs.build-output-dir }} \
              -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
              -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -S ${{ github.workspace }}

    # Emscripten 构建配置（使用工具链文件）
    - name: Configure CMake (Emscripten)
      if: ${{ matrix.emscripten }}
      run: |
        cmake -B ${{ steps.strings.outputs.build-output-dir }} \
              -DCMAKE_TOOLCHAIN_FILE=${{ env.EMSDK }}/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    # 原生测试（使用 ctest）
    - name: Test (Native)
      if: ${{ !matrix.emscripten }}
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }}

    # Emscripten 测试（根据项目实际情况调整）
    - name: Test (Emscripten)
      if: ${{ matrix.emscripten }}
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: |
        # 尝试查找并运行生成的 .js 测试文件（如果存在）
        if ls *.js 1> /dev/null 2>&1; then
          for testfile in *.js; do
            echo "Running $testfile with node"
            node "$testfile"
          done
        else
          echo "No JavaScript test files found, skipping test."
        fi
