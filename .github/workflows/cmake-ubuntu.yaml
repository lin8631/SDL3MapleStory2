name: Build Ubuntu Native and WebAssembly

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 原生 Linux 构建（gcc）
  native-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxi-dev libxcursor-dev libxfixes-dev libxrender-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libjack-jackd2-dev libsndio-dev \
            libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdrm-dev libgbm-dev \
            libusb-1.0-0-dev libunwind-dev \
            libpng-dev libbz2-dev libharfbuzz-dev \
            libfreetype-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev

      - name: Configure CMake (native)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -S .

      - name: Build native
        run: cmake --build build

      - name: Upload native executable
        uses: actions/upload-artifact@v4
        with:
          name: sdlMS-native
          path: build/sdlms/sdlMS
          if-no-files-found: error

  # WebAssembly 构建（Emscripten）
  emscripten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          echo "EMSDK=$PWD" >> $GITHUB_ENV
          echo "$PWD/upstream/emscripten" >> $GITHUB_PATH

      # 修补 zlib 的 CMakeLists.txt，移除所有 -march 选项（Emscripten 不支持）
      - name: Patch zlib CMakeLists.txt for Emscripten
        run: |
          sed -i '/-march/d' Game/wzlibcpp/zlib/CMakeLists.txt

      - name: Configure CMake (Emscripten)
        run: |
          cmake -B build-web \
                -DCMAKE_TOOLCHAIN_FILE=${{ env.EMSDK }}/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_FLAGS="" \
                -DCMAKE_CXX_FLAGS="" \
                -DCMAKE_SYSTEM_PROCESSOR=wasm32 \
                -DSDL_X11=OFF -DSDL_WAYLAND=OFF \
                -S .

      - name: Build WebAssembly
        run: cmake --build build-web

      - name: Upload WebAssembly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdlMS-web
          path: |
            build-web/sdlms/sdlMS.js
            build-web/sdlms/sdlMS.wasm
            build-web/sdlms/sdlMS.data
            build-web/sdlms/sdlMS.html
          if-no-files-found: warn
