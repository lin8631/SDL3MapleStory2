name: Build Ubuntu Native and WebAssembly

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 原生 Linux 构建（gcc）
  native-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxi-dev libxcursor-dev libxfixes-dev libxrender-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libjack-jackd2-dev libsndio-dev \
            libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdrm-dev libgbm-dev \
            libusb-1.0-0-dev libunwind-dev \
            libpng-dev libbz2-dev libharfbuzz-dev \
            libfreetype-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev

      - name: Configure CMake (native)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -S .

      - name: Build native
        run: cmake --build build

      - name: Upload native executable
        uses: actions/upload-artifact@v4
        with:
          name: sdlMS-native
          path: build/sdlms/sdlMS
          if-no-files-found: error

  # WebAssembly 构建（Emscripten）
    # WebAssembly 构建（Emscripten）- 强化修复
  emscripten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          echo "EMSDK=$PWD" >> $GITHUB_ENV
          echo "$PWD/upstream/emscripten" >> $GITHUB_PATH

      # 加强补丁：删除所有子模块中任何包含 -march 的 CMake 配置
      - name: Patch all submodules to remove -march
        run: |
          find Game Engine -name "CMakeLists.txt" -exec sed -i '/-march/d' {} \;
          find Game Engine -name "*.cmake" -exec sed -i '/-march/d' {} \;

      # 设置环境变量，防止 Emscripten 添加 -march
      - name: Set Emscripten flags
        run: |
          echo "EMCC_CFLAGS=-sUSE_ZLIB=1" >> $GITHUB_ENV
          echo "CFLAGS=" >> $GITHUB_ENV
          echo "CXXFLAGS=" >> $GITHUB_ENV

      - name: Configure CMake (Emscripten)
        run: |
          cmake -B build-web \
                -DCMAKE_TOOLCHAIN_FILE=${{ env.EMSDK }}/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_FLAGS="" \
                -DCMAKE_CXX_FLAGS="" \
                -DCMAKE_SYSTEM_PROCESSOR=wasm32 \
                -DSDL_X11=OFF -DSDL_WAYLAND=OFF \
                -DZLIB_INCLUDE_DIR="" -DZLIB_LIBRARY="" \
                -S .

      # 编译（如果失败，打印详细日志）
      - name: Build WebAssembly
        run: |
          cmake --build build-web --verbose || true
          # 如果构建失败，收集更多信息
          if [ $? -ne 0 ]; then
            echo "Build failed. Checking compiler commands..."
            find build-web -name "flags.make" -exec cat {} \;
            exit 1
          fi

      - name: Upload WebAssembly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdlMS-web
          path: |
            build-web/sdlms/sdlMS.js
            build-web/sdlms/sdlMS.wasm
            build-web/sdlms/sdlMS.data
            build-web/sdlms/sdlMS.html
          if-no-files-found: warn
